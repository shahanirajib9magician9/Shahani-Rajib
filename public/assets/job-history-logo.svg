<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="cyanGlowJob" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#00e5ff" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g filter="url(#cyanGlowJob)">
    <!-- Dashed Outer Circle Ring -->
    <circle cx="60" cy="60" r="39" stroke="#111111" stroke-width="3.5" stroke-dasharray="6 5" fill="none"/>
    <!-- Central Tan Circle -->
    <circle cx="60" cy="62" r="32" fill="#b4835a"/>

    <!-- Top Center Businessman -->
    <path d="M43 43 C43 34 49 30 60 30 C71 30 77 34 77 43 Z" fill="#d3ecfa" stroke="#111111" stroke-width="2.5"/>
    <polygon points="58,31 62,31 63,43 57,43" fill="#e53935" stroke="#111111" stroke-width="1.5"/>
    <ellipse cx="60" cy="21" rx="6.5" ry="8" fill="#f1ba8e" stroke="#111111" stroke-width="2.5"/>

    <!-- Red Star Speech Bubble inside circle -->
    <rect x="43" y="65" width="14" height="14" rx="4" fill="#d32f2f" stroke="#111111" stroke-width="2.2"/>
    <polygon points="50,68 51.4,71 54.6,71.4 52.3,73.6 52.8,76.8 50,75.2 47.2,76.8 47.7,73.6 45.4,71.4 48.6,71" fill="#fdd835"/>

    <!-- Small tilted mug & red bag icons inside circle -->
    <rect x="68" y="62" width="8" height="9" rx="1.5" transform="rotate(-15 72 66)" fill="#78718a" stroke="#111111" stroke-width="2"/>
    <rect x="62" y="75" width="7" height="7" rx="1.5" transform="rotate(15 65 78)" fill="#ef5350" stroke="#111111" stroke-width="2"/>

    <!-- Center Golden Banner "Job History" -->
    <rect x="37" y="42" width="46" height="21" rx="2" fill="#f8c12c" stroke="#111111" stroke-width="2.6"/>
    <text x="41" y="51" font-family="Poppins, Arial, sans-serif" font-weight="900" font-size="9.5" fill="#ffffff" stroke="#111111" stroke-width="1.2" paint-order="stroke">Job</text>
    <text x="51" y="60" font-family="Poppins, Arial, sans-serif" font-weight="900" font-size="9.5" fill="#ffffff" stroke="#111111" stroke-width="1.2" paint-order="stroke">History</text>

    <!-- Bottom Left Walking Businessman -->
    <circle cx="33" cy="70" r="3.8" fill="#f1ba8e" stroke="#111111" stroke-width="2"/>
    <path d="M27 89 L30 75 H36 L38 89 Z" fill="#d3ecfa" stroke="#111111" stroke-width="2"/>
    <path d="M28 89 L22 103 M35 89 L40 103" stroke="#7c98d6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bottom Briefcases -->
    <rect x="9" y="96" width="14" height="10" rx="2" fill="#9c6a43" stroke="#111111" stroke-width="2.2"/>
    <path d="M13 96 V93 H19 V96" stroke="#111111" stroke-width="2" fill="none"/>
    <rect x="43" y="96" width="14" height="10" rx="2" fill="#6f7a96" stroke="#111111" stroke-width="2.2"/>
    <path d="M47 96 V93 H53 V96" stroke="#111111" stroke-width="2" fill="none"/>

    <!-- Bottom Right Standing Businessman -->
    <circle cx="87" cy="69" r="3.8" fill="#f1ba8e" stroke="#111111" stroke-width="2"/>
    <path d="M79 89 L81 74 H93 L95 89 Z" fill="#d3ecfa" stroke="#111111" stroke-width="2"/>
    <polygon points="86,75 88,75 88.5,84 85.5,84" fill="#e53935"/>
    <path d="M83 89 L83 111 M91 89 L91 111" stroke="#616878" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Small yellow & purple bags held -->
    <rect x="70" y="88" width="9" height="8" rx="1.5" fill="#fbc02d" stroke="#111111" stroke-width="2"/>
    <rect x="95" y="84" width="9" height="8" rx="1.5" transform="rotate(-20 99 88)" fill="#8e7cc3" stroke="#111111" stroke-width="2"/>
    <!-- Right floating cyan bag -->
    <rect x="103" y="75" width="9" height="8" rx="1.5" fill="#e0f7fa" stroke="#111111" stroke-width="2"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Responsive Web Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #007bff;
            color: #ffffff;
            padding: 1.5rem 1rem;
            text-align: center;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 90%;
            margin: 2rem auto;
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        p {
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        footer {
            background-color: #333;
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }

        /* Mobile Device Optimization */
        @media (max-width: 600px) {
            main {
                width: 95%;
                padding: 1rem;
            }

            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Aamar Website</h1>
    </header>

    <main>
        <h2>Sagotom!</h2>
        <p>Ei webpage-ti phone ebong desktop—ubhay browser-e sothikbhabe dekhar jonno toiri kora hoyeche.</p>
        <button class="btn" onclick="alert('Hello!')">Click Korun</button>
    </main>

    <footer>
        &copy; 2026 Aamar Website. All rights reserved.
    </footer>

</body>
</html>
